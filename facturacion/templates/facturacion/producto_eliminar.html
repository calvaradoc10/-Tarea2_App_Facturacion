{% extends "base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="tarjeta text-center">
            <h1 class="h4 mb-3">¿Eliminar <span class="text-danger">{{ producto.nombre }}</span>?</h1>
            <p class="text-muted">Esta acción no se puede deshacer.</p>
            <form method="post">                      {# POST a esta misma dirección: ahí la vista sí elimina #}
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Sí, eliminar</button>
                <a href="{% url 'facturacion:producto_lista' %}" class="btn btn-outline-secondary">No, volver</a>  {# GET: no borra #}
            </form>
        </div>
    </div>
</div>
{% endblock %}
